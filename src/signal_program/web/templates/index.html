{% extends "base.html" %}
{% block title %}대시보드{% endblock %}

{% block content %}
<!-- SUMMARY STRIP -->
<div class="summary-strip">
  <div class="sum-cell"><div class="sum-label">전체</div><div class="sum-val" id="sum-total">—</div></div>
  <div class="sum-cell"><div class="sum-label">매수</div><div class="sum-val" id="sum-buy"   style="color:var(--color-buy)">—</div></div>
  <div class="sum-cell"><div class="sum-label">매도</div><div class="sum-val" id="sum-sell"  style="color:var(--color-sell)">—</div></div>
  <div class="sum-cell"><div class="sum-label">STRONG</div><div class="sum-val" id="sum-strong" style="color:var(--color-strong)">—</div></div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <select id="filter-market" class="tb-select" onchange="applyFilters()">
    <option value="">전체 마켓</option>
  </select>
  <select id="filter-mode" class="tb-select" onchange="applyFilters()">
    <option value="">전체 전략</option>
    <option value="BB_CCI">BB+CCI</option>
    <option value="FRACTAL">프랙탈</option>
  </select>
  <button class="tb-tag on"  data-dir=""     onclick="setDirFilter(this,'')">전체</button>
  <button class="tb-tag"     data-dir="buy"  onclick="setDirFilter(this,'buy')">매수</button>
  <button class="tb-tag"     data-dir="sell" onclick="setDirFilter(this,'sell')">매도</button>
  <button class="tb-tag"     data-str="strong" id="tb-strong-btn" onclick="toggleStrFilter(this)">STRONG</button>
  <span class="tb-spacer"></span>
  <span id="fb-rate-badge" class="fb-rate-badge" style="display:none"
        title="최근 신호 중 '👎 거짓'으로 회고된 비율 — 행을 클릭해 회고를 남기면 집계됩니다"></span>
  <span class="tb-refresh">↻ <span id="refresh-countdown">30</span>초 후 갱신</span>
</div>

<div id="error-msg" class="error-box" style="display:none;margin:8px 14px"></div>

<!-- SIGNAL TABLE -->
<div class="tbl-wrap">
  <table id="signal-table" {% if market=='kr' %}style="display:none"{% endif %}>
    <colgroup>
      <col style="width:16%"><col style="width:10%"><col style="width:13%">
      <col style="width:17%"><col style="width:11%"><col style="width:11%">
      <col style="width:11%">
    </colgroup>
    <thead>
      <tr>
        <th>마켓</th><th>방향</th><th>전략</th>
        <th class="r">현재가</th><th class="r">등락률</th>
        <th class="r">강도</th><th class="r">시각</th>
      </tr>
    </thead>
    <tbody id="signal-tbody"></tbody>
  </table>
  <div id="signal-empty" class="tbl-empty" style="display:none">
    시그널 없음 — 데몬 실행 후 시그널이 수신되면 여기에 표시됩니다.
  </div>

  <!-- 국장 테이블 -->
  <table id="kr-signal-table" {% if market!='kr' %}style="display:none"{% endif %}>
    <colgroup>
      <col style="width:16%"><col style="width:10%"><col style="width:13%">
      <col style="width:17%"><col style="width:11%"><col style="width:11%">
      <col style="width:11%">
    </colgroup>
    <thead>
      <tr>
        <th>종목</th><th>방향</th><th>전략</th>
        <th class="r">현재가</th><th class="r">등락률</th>
        <th class="r">강도</th><th class="r">시각</th>
      </tr>
    </thead>
    <tbody id="kr-signal-tbody"></tbody>
  </table>
  <div id="kr-signal-empty" class="tbl-empty" style="display:none">
    국장 시그널 없음
  </div>
</div>

<!-- PAGE FOOTER -->
<footer class="page-footer">
  <span class="footer-item">💾 signals.jsonl</span>
  <span class="footer-item">🕐 마지막 스캔: <span id="footer-last-scan">—</span></span>
  <span class="footer-item footer-right">참고용 시그널 · 자동매매 아님</span>
</footer>
{% endblock %}

{% block scripts %}
<script>
const POLL_INTERVAL_MS = 30_000;
const _MARKET_MODE = "{{ market }}";
</script>
<script src="/static/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var mTag = document.getElementById('topbar-market-status');
  if (mTag){ mTag.textContent = _MARKET_MODE === 'kr' ? '국장' : '코인'; mTag.style.display = ''; }
  if (_MARKET_MODE === 'kr') loadKrSignals();
});

async function loadKrSignals() {
  const url = '/api/kr/signals?limit=100';
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const records = await resp.json();
    renderTable(records, 'kr-signal-tbody', 'kr-signal-empty');
    updateCounters(records);
    document.getElementById('footer-last-scan').textContent = new Date().toLocaleTimeString('ko-KR');
  } catch (e) {
    const box = document.getElementById('error-msg');
    box.textContent = '국장 시그널 로드 실패: ' + e.message;
    box.style.display = '';
  }
}
</script>
{% endblock %}
