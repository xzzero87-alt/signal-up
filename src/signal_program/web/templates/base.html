<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}업비트 시그널{% endblock %} — 업비트 시그널 프로그램</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<script>
/* FOUC 방지: DOMContentLoaded 이전에 data-theme 설정 (M18: 다크 기본) */
(function(){
  var saved = localStorage.getItem('signal-theme');
  document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
})();
</script>

<header class="topbar">
  <span class="topbar-brand">SIGNAL</span>
  <div class="topbar-right">
    <span id="topbar-market-status" class="topbar-market-tag" style="display:none"></span>
    <div class="topbar-daemon">
      <span class="daemon-dot" id="topbar-daemon-dot"></span>
      <span id="topbar-daemon-text">데몬 확인 중</span>
    </div>
    <button class="btn-daemon" id="nav-daemon-btn" onclick="toggleDaemon()">—</button>
    <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" aria-label="테마 전환">
      <span id="themeIcon">☀️</span>
    </button>
    <span class="topbar-clock" id="topbar-clock"></span>
  </div>
</header>

<div class="app-body">
  <aside class="sidebar">
    <div class="sb-group-label">마켓</div>
    <a href="/?market=crypto" class="sb-item {% if market=='crypto' or (not market and active=='dashboard') %}on{% endif %}">
      <span class="sb-icon">₿</span>코인
      <span class="sb-badge" id="sb-badge-crypto">—</span>
    </a>
    <a href="/?market=kr" class="sb-item {% if market=='kr' %}on{% endif %}">
      <span class="sb-icon">⊞</span>국장
      <span class="sb-badge" id="sb-badge-kr">—</span>
    </a>


    <div class="sb-divider"></div>
    <div class="sb-group-label">오늘 현황</div>
    <div class="sb-stat-box">
      <div class="sb-stat-row"><span>전체</span><span id="sb-total" class="sb-stat-val">—</span></div>
      <div class="sb-stat-row"><span>매수</span><span id="sb-buy"   class="sb-stat-val" style="color:var(--color-buy)">—</span></div>
      <div class="sb-stat-row"><span>매도</span><span id="sb-sell"  class="sb-stat-val" style="color:var(--color-sell)">—</span></div>
    </div>

    <div class="sb-divider"></div>
    <div class="sb-group-label">메뉴</div>
    <a href="/backtest" class="sb-item {% if active=='backtest' %}on{% endif %}">
      <span class="sb-icon">📈</span>백테스트
    </a>
    <a href="/settings" class="sb-item {% if active=='settings' %}on{% endif %}">
      <span class="sb-icon">⚙</span>설정
    </a>
    <a href="/system" class="sb-item {% if active=='system' %}on{% endif %}">
      <span class="sb-icon">⊡</span>시스템
    </a>
    <a href="/failures" class="sb-item {% if active=='failures' %}on{% endif %}">
      <span class="sb-icon">⚠</span>알림 실패
    </a>
  </aside>

  <div class="main-area">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
/* ── 테마 토글 (M18: 다크 기본) ── */
function toggleTheme(){
  var html = document.documentElement;
  var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('signal-theme', next);
  var icon = document.getElementById('themeIcon');
  if (icon) icon.textContent = next === 'dark' ? '☀️' : '🌙';
}
document.addEventListener('DOMContentLoaded', function(){
  var saved = localStorage.getItem('signal-theme') || 'dark';
  var icon = document.getElementById('themeIcon');
  if (icon) icon.textContent = saved === 'dark' ? '☀️' : '🌙';
});

/* ── 시각 ── */
(function tickClock(){
  var el = document.getElementById('topbar-clock');
  if (el) el.textContent = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  setTimeout(tickClock, 1000);
})();

</script>
{% block scripts %}{% endblock %}
</body>
</html>
